# Top-level reverse proxy: routes /api to the backend container and everything
# else to the frontend (static SPA) container. Used only when running the full
# docker-compose stack together; not needed for local `npm run dev`.

upstream deenbyte_backend {
    server backend:5000;
}

upstream deenbyte_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://deenbyte_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://deenbyte_backend;
    }

    location / {
        proxy_pass http://deenbyte_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
